<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Menu</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
        {% for item in newmenu %}
            <tr{% if item.price == 0 %} style="background-color: lightgreen;"{% endif %}>
                <td>{{ item.name }}</td>
                <td>${{ item.price }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    
</body>
</html>
