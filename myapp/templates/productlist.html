{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>

<body>

    <h1>Product List</h1>

    <ul>

        {% for item in products %}

        <li>

            <img src="{% static item.image %}"
                 alt="{{ item.name }}"
                 width="150"
                 height="150">

            <p>Name: {{ item.name }}</p>

            <p>Brand: {{ item.brand }}</p>

            <p>Price: ₹{{ item.price }}</p>

        </li>

        {% endfor %}

    </ul>

</body>

</html>
